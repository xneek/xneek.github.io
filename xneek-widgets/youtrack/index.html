    <script>
      class Storage {
        constructor(name) {
          this.prefix = name;
        }

        getValue(key) {
          return JSON.parse(
            localStorage.getItem([this.prefix, key].join("__")) ?? "null",
          );
        }

        setValue(key, value) {
          localStorage.setItem(
            [this.prefix, key].join("__"),
            JSON.stringify(value),
          );
        }

        deleteValue() {
          localStorage.removeItem([this.prefix, key].join("__"));
        }
      }
