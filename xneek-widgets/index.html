<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xneek-widgets</title>
  <link rel="icon" sizes="512x512" href="icons/512.png" />
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json" />
</head>

<body data-theme="light">

  <script src="https://cdn.jsdelivr.net/npm/xneek-crel@2.4.0/dist/crel.min.js"></script>
  <script src="./main.js" type="module"></script>
  <main id="mainEl"></main>
  <footer id="mainFooter">
    <button id="themeBtn">День/Ночь</button>
    <button id="addBtn">Добавить</button>
  </footer>
  <script>
    themeBtn.onclick = () => {
      const nv = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = nv;
      window.localStorage.setItem('theme', nv)
    }

    document.body.dataset.theme = window.localStorage.getItem('theme') ?? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')


    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker зарегистрирован:', reg.scope))
          .catch((err) => console.log('Ошибка регистрации ServiceWorker:', err));
      });
    }
  </script>

</body>

</html>
